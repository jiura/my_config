set -a terminal-features "screen-256color:RGB"
set -g extended-keys always
set -as terminal-features 'xterm*:extkeys'
set -g default-shell /usr/bin/zsh

set -g prefix C-b

set -g base-index 1
set -g renumber-windows on
set -g mode-keys vi

set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default"

set -g message-style "bg=default"
set -g display-time 100

#set -g window-status-current-format "#W"
#setw -g automatic-rename on
set -g window-status-current-style "fg=blue bg=default bold"

set -g status-right ""
#set -g status-left "#S"
set -g status-left ""

bind -n C-t new-window -c "#{pane_current_path}"
bind -n C-s choose-window
bind -n C-d run-shell "~/.config/tmux/scripts/smart-kill-window.sh"
bind-key -n \uE001 select-window -t 1 # C-1
bind-key -n \uE002 select-window -t 2 # C-2
bind-key -n \uE003 select-window -t 3 # C-3...
bind-key -n \uE004 select-window -t 4
bind-key -n \uE005 select-window -t 5
bind-key -n \uE006 select-window -t 6
bind-key -n \uE007 select-window -t 7
bind-key -n \uE008 select-window -t 8
bind-key -n \uE009 select-window -t 9
bind-key -n M-Left previous-window
bind-key -n M-Right next-window
bind-key -n M-S-Left swap-window -t -1\; select-window -t -1
bind-key -n M-S-Right swap-window -t +1\; select-window -t +1

bind r source-file ~/.config/tmux/tmux.conf

# These are necessary for yazi's image preview
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Bind PageUp to scroll up a full page
bind -n PageUp if-shell -F "#{pane_in_mode}" "send-keys -X page-up" "copy-mode; send-keys -X page-up"
# Bind PageDown to scroll down a full page
bind -n PageDown if-shell -F "#{pane_in_mode}" "send-keys -X page-down" "copy-mode; send-keys -X page-down"
